<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e28"/>
      <stop offset="1" stop-color="#0d0f15"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset="1" stop-color="#00aaee"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0090cc"/>
      <stop offset="1" stop-color="#0069a3"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a45cf0"/>
      <stop offset="1" stop-color="#6f2fd0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- the spinning relief, drawn as an isometric cube -->
  <g>
    <path d="M64 22 L104 45 L64 68 L24 45 Z" fill="url(#top)"/>
    <path d="M24 45 L64 68 L64 110 L24 87 Z" fill="url(#left)"/>
    <path d="M104 45 L64 68 L64 110 L104 87 Z" fill="url(#right)"/>
    <path d="M64 22 L104 45 L64 68 L24 45 Z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <path d="M24 45 L64 68 L64 110 L24 87 Z" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <path d="M104 45 L64 68 L64 110 L104 87 Z" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>

  <!-- the shading characters the relief is built from -->
  <g fill="#ffffff" fill-opacity="0.55" font-family="monospace" font-size="11" text-anchor="middle">
    <text x="44" y="55">.o+</text>
    <text x="80" y="57">+.</text>
    <text x="42" y="82">:=*</text>
    <text x="84" y="84">*:</text>
  </g>
</svg>
