app-id: io.github.rutytoi220._3dfetch
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: 3dfetch

finish-args:
  # The tool reads the host's /etc/os-release to work out which distro logo
  # to draw, and needs the host's /proc and /sys for the system info.
  - --filesystem=host-os:ro
  # The config and the custom logo live in ~/.config/fetch.
  - --filesystem=xdg-config/fetch:create

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - /share/licenses
  - /share/bash-completion
  - '*.la'
  - '*.a'

modules:
  # fastfetch draws the distro logos. It is not a dependency of the tool
  # itself, but without it there is no logo to spin.
  - name: fastfetch
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_FLASHFETCH=OFF
      - -DBUILD_TESTS=OFF
      - -DENABLE_IMAGE_LOGO=OFF
      - -DENABLE_ZLIB=OFF
      - -DENABLE_LUA=OFF
      - -DENABLE_LIBZFS=OFF
      - -DENABLE_LTO=OFF
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: archive
        url: https://github.com/fastfetch-cli/fastfetch/archive/refs/tags/2.70.0.tar.gz
        sha256: 8aa01bd3faff2be1d94f231d76489ce6d9f781f51f6e93eafe82359d6d8669af

  - name: 3dfetch
    buildsystem: simple
    build-commands:
      - make
      - make install DESTDIR=/app PREFIX=
      # The desktop entry, the appstream data and the icon live in the
      # upstream repository, so they are taken from the source rather than
      # copied into the manifest.
      - install -Dm644 flatpak/io.github.rutytoi220._3dfetch.desktop
        /app/share/applications/io.github.rutytoi220._3dfetch.desktop
      - install -Dm644 flatpak/io.github.rutytoi220._3dfetch.metainfo.xml
        /app/share/metainfo/io.github.rutytoi220._3dfetch.metainfo.xml
      - install -Dm644 flatpak/io.github.rutytoi220._3dfetch.svg
        /app/share/icons/hicolor/scalable/apps/io.github.rutytoi220._3dfetch.svg
    sources:
      - type: archive
        url: https://github.com/Rutytoi220/3dfetch/archive/refs/tags/v0.5.0.tar.gz
        sha256: 8c30ee7d1c93727fbd2b105dd5e097cf81551432105fa14abecbecb9a25bac6b
